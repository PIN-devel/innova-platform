# Apache APISIX Stand-alone Configuration for Cloud Run
# Refer to: https://apisix.apache.org/docs/apisix/deployment-modes/#stand-alone

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

apisix:
  node_listen: 8080             # Cloud Run default port
  enable_admin: false           # Admin API disabled in Stand-alone mode
  enable_control: false

# DNS resolver configuration (Root level in APISIX schema)
dns_resolver:
  - 8.8.8.8                     # Google Public DNS (first for external domain resolution)
  - 1.1.1.1                     # Cloudflare DNS
  - 127.0.0.11                  # Docker local network resolver
dns_resolver_valid: 30
resolver_timeout: 5

nginx_config:
  error_log: "/dev/stderr"
  error_log_level: "info"
  worker_processes: "auto"
  events:
    worker_connections: 10620
