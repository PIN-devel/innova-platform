name: Deploy Production (Prod Gateway & Cloud Run)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-gateway:
    name: Deploy APISIX Gateway to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || secrets.GAR_REPOSITORY }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      UPSTREAM_RENDER_URL: ${{ vars.UPSTREAM_RENDER_URL || secrets.UPSTREAM_RENDER_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate APISIX Gateway configuration
        run: sh apps/api-gateway/scripts/validate-config.sh

      - name: Check deployment configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GCP_PROJECT_ID is not configured in Variables or Secrets."
          elif [ -z "$GAR_REPOSITORY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GAR_REPOSITORY is not configured in Variables or Secrets."
          elif [ -z "$UPSTREAM_RENDER_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: UPSTREAM_RENDER_URL is not configured in Variables or Secrets."
          elif [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured in Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration present. Proceeding with WIF authentication."
          fi

      - name: Authenticate to Google Cloud via WIF
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.check_config.outputs.configured == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push innova-api-gateway image
        if: steps.check_config.outputs.configured == 'true'
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/innova-api-gateway:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" apps/api-gateway
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy innova-api-gateway to Cloud Run
        if: steps.check_config.outputs.configured == 'true'
        run: |
          gcloud run deploy innova-api-gateway \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars="UPSTREAM_RENDER_URL=${UPSTREAM_RENDER_URL}"

          GATEWAY_URL=$(gcloud run services describe innova-api-gateway --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')
          echo "Production Cloud Run Gateway URL: ${GATEWAY_URL}"
          echo "### 🚀 Production Gateway Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${GATEWAY_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Check:** ${GATEWAY_URL}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"
