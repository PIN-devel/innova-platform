name: Deploy Production (Prod Gateway & Firebase Hosting)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      finance: ${{ steps.filter.outputs.finance }}
      ai: ${{ steps.filter.outputs.ai }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Paths Filter
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            auth:
              - 'services/auth/**'
              - 'packages/auth-kit/**'
              - 'packages/contracts/**'
              - '.github/workflows/deploy-production.yml'
            finance:
              - 'services/finance/**'
              - 'packages/auth-kit/**'
              - 'packages/contracts/**'
              - '.github/workflows/deploy-production.yml'
            ai:
              - 'services/ai/**'
              - 'packages/auth-kit/**'
              - 'packages/contracts/**'
              - '.github/workflows/deploy-production.yml'
            gateway:
              - 'apps/api-gateway/**'
              - '.github/workflows/deploy-production.yml'
            frontend:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - '.github/workflows/deploy-production.yml'

  deploy-auth:
    name: Deploy Auth Service to Cloud Run
    needs: changes
    if: needs.changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      auth_url: ${{ steps.deploy.outputs.auth_url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || secrets.GAR_REPOSITORY }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
      LEGACY_DATABASE_URL: ${{ secrets.LEGACY_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deployment configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GCP_PROJECT_ID is not configured in Variables or Secrets."
          elif [ -z "$GAR_REPOSITORY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GAR_REPOSITORY is not configured in Variables or Secrets."
          elif [ -z "$AUTH_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: AUTH_DATABASE_URL is not configured in Secrets."
          elif [ -z "$JWT_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: JWT_SECRET is not configured in Secrets."
          elif [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured in Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration present. Proceeding with WIF authentication."
          fi

      - name: Authenticate to Google Cloud via WIF
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.check_config.outputs.configured == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Install pnpm
        if: steps.check_config.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.check_config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.check_config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --filter @innova/auth...

      - name: Run DB migration for Auth Service
        if: steps.check_config.outputs.configured == 'true'
        run: |
          pnpm --filter @innova/contracts build
          pnpm --filter @innova/auth db:migrate
        env:
          DATABASE_URL: ${{ env.AUTH_DATABASE_URL }}

      - name: Build and push innova-auth-api image
        if: steps.check_config.outputs.configured == 'true'
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/innova-auth-api:${GITHUB_SHA}"
          docker build -f services/auth/Dockerfile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy innova-auth-api to Cloud Run
        id: deploy
        if: steps.check_config.outputs.configured == 'true'
        run: |
          ENV_VARS="^||^NODE_ENV=production||AUTH_COOKIE_NAME=innova_auth||DATABASE_URL=${AUTH_DATABASE_URL}||JWT_SECRET=${JWT_SECRET}"
          if [ -n "${LEGACY_DATABASE_URL}" ]; then
            ENV_VARS="${ENV_VARS}||LEGACY_DATABASE_URL=${LEGACY_DATABASE_URL}"
          fi

          gcloud run deploy innova-auth-api \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars="${ENV_VARS}"

          AUTH_URL=$(gcloud run services describe innova-auth-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')
          echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
          echo "Production Cloud Run Auth URL: ${AUTH_URL}"
          echo "### 🚀 Production Auth Service Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${AUTH_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Check:** ${AUTH_URL}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-finance:
    name: Deploy Finance Service to Cloud Run
    needs: [changes, deploy-auth]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.finance == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      finance_url: ${{ steps.deploy.outputs.finance_url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || secrets.GAR_REPOSITORY }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      FINANCE_DATABASE_URL: ${{ secrets.FINANCE_DATABASE_URL }}
      AUTH_SERVICE_URL_FROM_JOB: ${{ needs.deploy-auth.outputs.auth_url }}
      UPSTREAM_AUTH_URL: ${{ vars.UPSTREAM_AUTH_URL || secrets.UPSTREAM_AUTH_URL }}
      UPSTREAM_RENDER_URL: ${{ vars.UPSTREAM_RENDER_URL || secrets.UPSTREAM_RENDER_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FINANCE_RAW_ENCRYPTION_KEY: ${{ secrets.FINANCE_RAW_ENCRYPTION_KEY }}
      FINANCE_PDF_PASSWORD_KEYRING: ${{ secrets.FINANCE_PDF_PASSWORD_KEYRING }}
      FINANCE_PDF_PASSWORD_ACTIVE_KEY_VERSION: ${{ vars.FINANCE_PDF_PASSWORD_ACTIVE_KEY_VERSION || secrets.FINANCE_PDF_PASSWORD_ACTIVE_KEY_VERSION || 'v1' }}
      FINANCE_ALLOWED_ORIGINS: ${{ vars.FINANCE_ALLOWED_ORIGINS || secrets.FINANCE_ALLOWED_ORIGINS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deployment configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GCP_PROJECT_ID is not configured in Variables or Secrets."
          elif [ -z "$GAR_REPOSITORY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GAR_REPOSITORY is not configured in Variables or Secrets."
          elif [ -z "$FINANCE_DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: FINANCE_DATABASE_URL is not configured in Secrets."
          elif [ -z "$FINANCE_RAW_ENCRYPTION_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: FINANCE_RAW_ENCRYPTION_KEY is not configured in Secrets."
          elif [ -z "$JWT_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: JWT_SECRET is not configured in Secrets."
          elif [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured in Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration present. Proceeding with WIF authentication."
          fi

      - name: Authenticate to Google Cloud via WIF
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Auth Service URL
        id: resolve_auth
        if: steps.check_config.outputs.configured == 'true'
        run: |
          AUTH_URL="${AUTH_SERVICE_URL_FROM_JOB:-${UPSTREAM_AUTH_URL}}"
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL=$(gcloud run services describe innova-auth-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL="${UPSTREAM_RENDER_URL}"
          fi
          if [ -z "$AUTH_URL" ]; then
            echo "::error::Unable to resolve AUTH_SERVICE_URL (innova-auth-api Cloud Run URL or UPSTREAM_AUTH_URL)."
            exit 1
          fi
          echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved AUTH_SERVICE_URL: ${AUTH_URL}"

      - name: Configure Docker for Artifact Registry
        if: steps.check_config.outputs.configured == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Install pnpm
        if: steps.check_config.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.check_config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.check_config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --filter @innova/finance...

      - name: Run DB migration for Finance Service
        if: steps.check_config.outputs.configured == 'true'
        run: |
          pnpm --filter @innova/contracts build
          pnpm --filter @innova/finance db:migrate
        env:
          DATABASE_URL: ${{ env.FINANCE_DATABASE_URL }}

      - name: Build and push innova-finance-api image
        if: steps.check_config.outputs.configured == 'true'
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/innova-finance-api:${GITHUB_SHA}"
          docker build -f services/finance/Dockerfile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy innova-finance-api to Cloud Run
        id: deploy
        if: steps.check_config.outputs.configured == 'true'
        run: |
          AUTH_URL="${{ steps.resolve_auth.outputs.auth_url }}"
          ORIGINS="${FINANCE_ALLOWED_ORIGINS:-https://${GCP_PROJECT_ID}.web.app,https://${GCP_PROJECT_ID}.firebaseapp.com}"
          ENV_VARS="^||^NODE_ENV=production||AUTH_COOKIE_NAME=innova_auth||DATABASE_URL=${FINANCE_DATABASE_URL}||AUTH_SERVICE_URL=${AUTH_URL}||JWT_SECRET=${JWT_SECRET}||FINANCE_RAW_ENCRYPTION_KEY=${FINANCE_RAW_ENCRYPTION_KEY}||FINANCE_ALLOWED_ORIGINS=${ORIGINS}"
          if [ -n "${FINANCE_PDF_PASSWORD_KEYRING}" ]; then
            ENV_VARS="${ENV_VARS}||FINANCE_PDF_PASSWORD_KEYRING=${FINANCE_PDF_PASSWORD_KEYRING}||FINANCE_PDF_PASSWORD_ACTIVE_KEY_VERSION=${FINANCE_PDF_PASSWORD_ACTIVE_KEY_VERSION}"
          fi

          gcloud run deploy innova-finance-api \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="${ENV_VARS}"

          FINANCE_URL=$(gcloud run services describe innova-finance-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')
          echo "finance_url=${FINANCE_URL}" >> "$GITHUB_OUTPUT"
          echo "Production Cloud Run Finance URL: ${FINANCE_URL}"
          echo "### 🚀 Production Finance Service Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${FINANCE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Check:** ${FINANCE_URL}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-ai:
    name: Deploy AI Service to Cloud Run
    needs: [changes, deploy-auth]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.ai == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      ai_url: ${{ steps.deploy.outputs.ai_url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || secrets.GAR_REPOSITORY }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      AUTH_SERVICE_URL_FROM_JOB: ${{ needs.deploy-auth.outputs.auth_url }}
      UPSTREAM_AUTH_URL: ${{ vars.UPSTREAM_AUTH_URL || secrets.UPSTREAM_AUTH_URL }}
      UPSTREAM_RENDER_URL: ${{ vars.UPSTREAM_RENDER_URL || secrets.UPSTREAM_RENDER_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EXAONE_API_KEY: ${{ secrets.EXAONE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deployment configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GCP_PROJECT_ID is not configured in Variables or Secrets."
          elif [ -z "$GAR_REPOSITORY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GAR_REPOSITORY is not configured in Variables or Secrets."
          elif [ -z "$EXAONE_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: EXAONE_API_KEY is not configured in Secrets."
          elif [ -z "$JWT_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: JWT_SECRET is not configured in Secrets."
          elif [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured in Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration present. Proceeding with WIF authentication."
          fi

      - name: Authenticate to Google Cloud via WIF
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Auth Service URL
        id: resolve_auth
        if: steps.check_config.outputs.configured == 'true'
        run: |
          AUTH_URL="${AUTH_SERVICE_URL_FROM_JOB:-${UPSTREAM_AUTH_URL}}"
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL=$(gcloud run services describe innova-auth-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$AUTH_URL" ]; then
            AUTH_URL="${UPSTREAM_RENDER_URL}"
          fi
          if [ -z "$AUTH_URL" ]; then
            echo "::error::Unable to resolve AUTH_SERVICE_URL (innova-auth-api Cloud Run URL or UPSTREAM_AUTH_URL)."
            exit 1
          fi
          echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved AUTH_SERVICE_URL: ${AUTH_URL}"

      - name: Configure Docker for Artifact Registry
        if: steps.check_config.outputs.configured == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Install pnpm
        if: steps.check_config.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.check_config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.check_config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --filter @innova/ai...

      - name: Build and push innova-ai-api image
        if: steps.check_config.outputs.configured == 'true'
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/innova-ai-api:${GITHUB_SHA}"
          docker build -f services/ai/Dockerfile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy innova-ai-api to Cloud Run
        id: deploy
        if: steps.check_config.outputs.configured == 'true'
        run: |
          AUTH_URL="${{ steps.resolve_auth.outputs.auth_url }}"
          ENV_VARS="^||^NODE_ENV=production||AUTH_COOKIE_NAME=innova_auth||AUTH_SERVICE_URL=${AUTH_URL}||JWT_SECRET=${JWT_SECRET}||EXAONE_API_KEY=${EXAONE_API_KEY}"

          gcloud run deploy innova-ai-api \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=80 \
            --timeout=60s \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars="${ENV_VARS}"

          AI_URL=$(gcloud run services describe innova-ai-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')
          echo "ai_url=${AI_URL}" >> "$GITHUB_OUTPUT"
          echo "Production Cloud Run AI URL: ${AI_URL}"
          echo "### 🚀 Production AI Service Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${AI_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Check:** ${AI_URL}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-gateway:
    name: Deploy APISIX Gateway to Cloud Run
    needs: [changes, deploy-auth, deploy-finance, deploy-ai]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.gateway == 'true' || needs.changes.outputs.auth == 'true' || needs.changes.outputs.finance == 'true' || needs.changes.outputs.ai == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || secrets.GAR_REPOSITORY }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      UPSTREAM_RENDER_URL: ${{ vars.UPSTREAM_RENDER_URL || secrets.UPSTREAM_RENDER_URL }}
      UPSTREAM_AUTH_URL: ${{ needs.deploy-auth.outputs.auth_url || vars.UPSTREAM_AUTH_URL || secrets.UPSTREAM_AUTH_URL }}
      UPSTREAM_FINANCE_URL: ${{ needs.deploy-finance.outputs.finance_url || vars.UPSTREAM_FINANCE_URL || secrets.UPSTREAM_FINANCE_URL }}
      UPSTREAM_AI_URL: ${{ needs.deploy-ai.outputs.ai_url || vars.UPSTREAM_AI_URL || secrets.UPSTREAM_AI_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate APISIX Gateway configuration
        run: sh apps/api-gateway/scripts/validate-config.sh

      - name: Check deployment configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GCP_PROJECT_ID is not configured in Variables or Secrets."
          elif [ -z "$GAR_REPOSITORY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GAR_REPOSITORY is not configured in Variables or Secrets."
          elif [ -z "$UPSTREAM_RENDER_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: UPSTREAM_RENDER_URL is not configured in Variables or Secrets."
          elif [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured in Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration present. Proceeding with WIF authentication."
          fi

      - name: Authenticate to Google Cloud via WIF
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: steps.check_config.outputs.configured == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Resolve Upstream Auth URL
        if: steps.check_config.outputs.configured == 'true'
        id: resolve_auth_url
        run: |
          RESOLVED="${UPSTREAM_AUTH_URL}"
          if [ -z "$RESOLVED" ]; then
            RESOLVED=$(gcloud run services describe innova-auth-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$RESOLVED" ]; then
            RESOLVED="${UPSTREAM_RENDER_URL}"
            echo "Notice: innova-auth-api not found; falling back to UPSTREAM_RENDER_URL for auth routing."
          fi
          echo "resolved_url=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Resolved UPSTREAM_AUTH_URL: ${RESOLVED}"

      - name: Resolve Upstream Finance URL
        if: steps.check_config.outputs.configured == 'true'
        id: resolve_finance_url
        run: |
          RESOLVED="${UPSTREAM_FINANCE_URL}"
          if [ -z "$RESOLVED" ]; then
            RESOLVED=$(gcloud run services describe innova-finance-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$RESOLVED" ]; then
            RESOLVED="${UPSTREAM_RENDER_URL}"
            echo "Notice: innova-finance-api not found; falling back to UPSTREAM_RENDER_URL for finance routing."
          fi
          echo "resolved_url=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Resolved UPSTREAM_FINANCE_URL: ${RESOLVED}"

      - name: Resolve Upstream AI URL
        if: steps.check_config.outputs.configured == 'true'
        id: resolve_ai_url
        run: |
          RESOLVED="${UPSTREAM_AI_URL}"
          if [ -z "$RESOLVED" ]; then
            RESOLVED=$(gcloud run services describe innova-ai-api --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)' 2>/dev/null || true)
          fi
          if [ -z "$RESOLVED" ]; then
            RESOLVED="${UPSTREAM_RENDER_URL}"
            echo "Notice: innova-ai-api not found; falling back to UPSTREAM_RENDER_URL for AI routing."
          fi
          echo "resolved_url=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "Resolved UPSTREAM_AI_URL: ${RESOLVED}"

      - name: Build and push innova-api-gateway image
        if: steps.check_config.outputs.configured == 'true'
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/innova-api-gateway:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" apps/api-gateway
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy innova-api-gateway to Cloud Run
        if: steps.check_config.outputs.configured == 'true'
        run: |
          AUTH_URL="${{ steps.resolve_auth_url.outputs.resolved_url }}"
          FINANCE_URL="${{ steps.resolve_finance_url.outputs.resolved_url }}"
          AI_URL="${{ steps.resolve_ai_url.outputs.resolved_url }}"
          gcloud run deploy innova-api-gateway \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=1 \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars="^||^UPSTREAM_RENDER_URL=${UPSTREAM_RENDER_URL}||UPSTREAM_AUTH_URL=${AUTH_URL}||UPSTREAM_FINANCE_URL=${FINANCE_URL}||UPSTREAM_AI_URL=${AI_URL}"

          GATEWAY_URL=$(gcloud run services describe innova-api-gateway --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')
          echo "Production Cloud Run Gateway URL: ${GATEWAY_URL}"
          echo "### 🚀 Production Gateway Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${GATEWAY_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Check:** ${GATEWAY_URL}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy Web Frontend to Firebase Hosting
    needs: [changes, deploy-gateway]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deployment configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: GCP_PROJECT_ID is not configured in Variables or Secrets."
          elif [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: WIF_PROVIDER or WIF_SERVICE_ACCOUNT is not configured in Secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All required deployment configuration present. Proceeding with Firebase Hosting deployment."
          fi

      - name: Install pnpm
        if: steps.check_config.outputs.configured == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.check_config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.check_config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Contracts and Web Frontend
        if: steps.check_config.outputs.configured == 'true'
        run: |
          pnpm --filter @innova/contracts build
          pnpm --filter @innova/web build

      - name: Authenticate to Google Cloud via WIF
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy to Firebase Hosting (Production)
        if: steps.check_config.outputs.configured == 'true'
        run: |
          npx --yes firebase-tools@latest deploy --only hosting --project "${GCP_PROJECT_ID}" --non-interactive
          echo "### 🚀 Firebase Hosting Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project ID:** \`${GCP_PROJECT_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hosting URL:** https://${GCP_PROJECT_ID}.web.app" >> "$GITHUB_STEP_SUMMARY"
