name: Deploy Production (Prod Gateway & Cloud Run)

on:
  push:
    branches:
      - main
      - feature/pin-74-apisix-gateway
  workflow_dispatch:

concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Workspace Verify (Build, Typecheck, Test, Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Validate APISIX Gateway config
        run: sh apps/api-gateway/scripts/validate-config.sh

      - name: Run linter
        run: pnpm lint

  deploy-production:
    name: Deploy Prod API Gateway
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      GCP_REGION: asia-northeast3
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'innova-containers' }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      UPSTREAM_RENDER_URL: ${{ vars.UPSTREAM_RENDER_URL || 'https://innova-api-y9s6.onrender.com' }}
    steps:
      - name: Check GCP authentication configuration
        id: check_config
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Production deployment: GCP_PROJECT_ID is not configured."
          elif [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=key" >> "$GITHUB_OUTPUT"
            echo "Using Service Account Key authentication."
          elif [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "auth_mode=wif" >> "$GITHUB_OUTPUT"
            echo "Using Workload Identity Federation (WIF) authentication."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Production cloud deployment: Neither GCP_SA_KEY nor WIF (WIF_PROVIDER + WIF_SERVICE_ACCOUNT) are configured."
          fi

      - name: Checkout repository
        if: steps.check_config.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Service Account Key)
        if: steps.check_config.outputs.auth_mode == 'key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.check_config.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.check_config.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: steps.check_config.outputs.configured == 'true'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push innova-api-gateway image
        if: steps.check_config.outputs.configured == 'true'
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/innova-api-gateway:${GITHUB_SHA}"
          docker build -t "${IMAGE_URI}" apps/api-gateway
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Deploy innova-api-gateway to Cloud Run
        if: steps.check_config.outputs.configured == 'true'
        run: |
          gcloud run deploy innova-api-gateway \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_URI}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=0 \
            --max-instances=2 \
            --memory=256Mi \
            --cpu=1 \
            --set-env-vars="UPSTREAM_RENDER_URL=${UPSTREAM_RENDER_URL}"

          GATEWAY_URL=$(gcloud run services describe innova-api-gateway --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}" --format='value(status.url)')
          echo "Production Cloud Run Gateway URL: ${GATEWAY_URL}"
          echo "### 🚀 Production Gateway Deployed!" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cloud Run URL:** ${GATEWAY_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Health Check:** ${GATEWAY_URL}/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"
